<svg xmlns="http://www.w3.org/2000/svg" width="358" height="285" viewBox="0 0 358 285" role="img" aria-labelledby="t d">
<title id="t">MBM-Core is the only defense complete on every axis</title>
<desc id="d">A scorecard of defense paradigms (rows) against five axes (columns): per-record mediation out of 180 cases, recomputed causal reachability (P7), integrity flow (P8), set-level merge resolution, and replay-detectable audit. Every conventional paradigm, and even their combination, fails at least one axis; only MBM-Core is complete on all five.</desc>
