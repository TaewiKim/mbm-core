<svg xmlns="http://www.w3.org/2000/svg" width="384" height="366" viewBox="0 0 384 366" role="img" aria-labelledby="t d">
<title id="t">The two-stage message-bound gate</title>
<desc id="d">A true multi-parent merge makes both conflicting records genuine ancestors of the active message. Stage 1, the per-record gate, authorizes each candidate independently (eight conjunctive checks, in the supplement) and admits both r_A and r_B because each is reachable. The per-record-admitted set passes to Stage 2, the set-level coherent view, which governs the served set: with no signed resolution certificate it denies the unresolved union (require_resolution); with a certificate bound to the exact conflict set it serves only the adopted version. Reachable is not adopted.</desc>
<defs><style>text{font-family:DejaVuSans}.b{font-family:DejaVuSans-Bold}</style></defs>
<rect x="0" y="0" width="384" height="366" fill="#ffffff"/>

<rect x="8" y="6" width="368" height="30" rx="9" fill="#0b7285"/>
<text x="192" y="26" class="b" fill="#ffffff" font-size="14" text-anchor="middle">TWO-STAGE MESSAGE-BOUND GATE</text>
<text x="192" y="48" fill="#5b6573" font-size="9.5" text-anchor="middle">m = merge(A, B): r_A (7d) and r_B (30d) are both genuine ancestors</text>

<!-- STAGE 1 -->
<rect x="8" y="56" width="368" height="110" rx="10" fill="#eef7f9" stroke="#0b7285" stroke-width="1.6"/>
<text x="20" y="74" class="b" fill="#075766" font-size="13" text-anchor="start">STAGE 1 &#183; PER-RECORD GATE</text>
<text x="20" y="89" fill="#6b7280" font-size="9" text-anchor="start">authorize each independently &#183; 8 conjunctive checks (supp.)</text>
<rect x="16" y="94" width="352" height="22" rx="6" fill="#e7f5f7" stroke="#0b7285" stroke-width="1.1"/>
<text x="24" y="109" fill="#075766" font-size="9.5" text-anchor="start">write-event causal precedence</text>
<rect x="16" y="118" width="352" height="22" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.1"/>
<text x="24" y="133" fill="#5b21b6" font-size="9.5" text-anchor="start">integrity flow (Biba): I(rec) &#8805; I(m)</text>
<text x="20" y="158" class="b" fill="#0b6b4f" font-size="12" text-anchor="start">r_A &#8594; ADMIT       r_B &#8594; ADMIT</text>

<line x1="192" y1="166" x2="192" y2="173" stroke="#5b6573" stroke-width="1.4"/>
<polygon points="188,170 196,170 192,176" fill="#5b6573"/>
<rect x="96" y="175" width="192" height="20" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.1"/>
<text x="192" y="189" class="b" fill="#1f2937" font-size="10" text-anchor="middle">admitted set { r_A , r_B }</text>
<line x1="192" y1="195" x2="192" y2="202" stroke="#5b6573" stroke-width="1.4"/>
<polygon points="188,199 196,199 192,205" fill="#5b6573"/>

<!-- STAGE 2 -->
<rect x="8" y="206" width="368" height="122" rx="10" fill="#eef3f8" stroke="#03406a" stroke-width="1.6"/>
<text x="20" y="224" class="b" fill="#03406a" font-size="13" text-anchor="start">STAGE 2 &#183; SET-LEVEL VIEW</text>
<text x="20" y="239" fill="#6b7280" font-size="9" text-anchor="start">governs the served set (same logical_key K)</text>
<rect x="16" y="244" width="352" height="36" rx="7" fill="#fbeadd" stroke="#d55e00" stroke-width="1.4"/>
<text x="24" y="260" class="b" fill="#a23a17" font-size="10.5" text-anchor="start">no cert &#8594; REQUIRE_RESOLUTION</text>
<text x="24" y="274" fill="#7a2e1a" font-size="9" text-anchor="start">unresolved union denied; never served jointly</text>
<rect x="16" y="284" width="352" height="36" rx="7" fill="#e1f3ec" stroke="#009e73" stroke-width="1.4"/>
<text x="24" y="300" class="b" fill="#0b6b4f" font-size="10.5" text-anchor="start">signed cert &#8594; serve adopted only</text>
<text x="24" y="314" fill="#0b6b4f" font-size="9" text-anchor="start">(cert bound to the exact conflict set)</text>

<text x="192" y="344" class="b" fill="#1f2937" font-size="10" text-anchor="middle">Reachable &#8800; adopted: per-record admits both;</text>
<text x="192" y="356" fill="#1f2937" font-size="9" text-anchor="middle">the set-level gate denies the unresolved union.</text>
</svg>
