<svg xmlns="http://www.w3.org/2000/svg" width="384" height="486" viewBox="0 0 384 486" role="img" aria-labelledby="t d">
<title id="t">The communication-memory mismatch and the two-stage message-bound gate</title>
<desc id="d">Panel (a), the problem as a data-flow: a shared store holds sigma_A (run A), sigma_B (run B), and a downloaded agent.md; the same store read two ways -- an unbound read (C4) serves sigma_A or executes agent.md and is wrong or injected, while a message-bound read (C5) serves only sigma_B, denying sigma_A on a run mismatch and agent.md by integrity flow. Panel (b), the defense: a merge DAG where branch A writes r_A (7d) and branch B writes r_B (30d) and both are genuine ancestors of the merge message m, so Stage 1 (per-record gate) admits both; Stage 2 (set-level coherent view) denies the unresolved union unless a signed resolution certificate names the adopted version. Reachable is not adopted; valid-at-read is not valid-at-commit.</desc>
<defs>
<style>text{font-family:DejaVuSans}.b{font-family:DejaVuSans-Bold}</style>
<marker id="ah" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5b6573"/></marker>
</defs>
<rect x="0" y="0" width="384" height="486" fill="#ffffff"/>

<rect x="8" y="6" width="368" height="28" rx="8" fill="#0b7285"/>
<text x="192" y="25" class="b" fill="#ffffff" font-size="13" text-anchor="middle">THE MISMATCH AND THE MESSAGE-BOUND GATE</text>

<!-- ===================== (a) THE PROBLEM (data flow) ===================== -->
<text x="10" y="52" class="b" fill="#0b7285" font-size="12" text-anchor="start">(a) Relevance is not authorization</text>

<!-- shared store strip -->
<rect x="8" y="58" width="368" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="16" y="79" class="b" fill="#475569" font-size="10" text-anchor="start">Shared store S</text>
<rect x="106" y="64" width="70" height="22" rx="5" fill="#eef2f7" stroke="#94a3b8" stroke-width="1"/>
<text x="141" y="79" fill="#334155" font-size="9.5" text-anchor="middle">&#963;_A &#183; run A</text>
<rect x="180" y="64" width="70" height="22" rx="5" fill="#eef2f7" stroke="#94a3b8" stroke-width="1"/>
<text x="215" y="79" fill="#334155" font-size="9.5" text-anchor="middle">&#963;_B &#183; run B</text>
<rect x="254" y="64" width="84" height="22" rx="5" fill="#fff7ed" stroke="#d97706" stroke-width="1"/>
<text x="296" y="79" fill="#92400e" font-size="9.5" text-anchor="middle">agent.md &#9888;</text>

<!-- fork: the same store read two ways -->
<line x1="180" y1="92" x2="100" y2="106" stroke="#5b6573" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="204" y1="92" x2="284" y2="106" stroke="#5b6573" stroke-width="1.4" marker-end="url(#ah)"/>

<!-- C4 (unbound) -->
<rect x="8" y="108" width="176" height="58" rx="7" fill="#fbeadd" stroke="#d55e00" stroke-width="1.4"/>
<text x="18" y="126" class="b" fill="#a23a17" font-size="10.5" text-anchor="start">C4: unbound read</text>
<text x="18" y="143" fill="#7a2e1a" font-size="9.5" text-anchor="start">serves &#963;_A / agent.md</text>
<text x="18" y="160" class="b" fill="#b23a17" font-size="10" text-anchor="start">&#8594; WRONG / INJECTED</text>

<!-- C5 (message-bound) -->
<rect x="200" y="108" width="176" height="58" rx="7" fill="#e1f3ec" stroke="#009e73" stroke-width="1.4"/>
<text x="210" y="126" class="b" fill="#0b6b4f" font-size="10.5" text-anchor="start">C5: message-bound</text>
<text x="210" y="143" fill="#0b6b4f" font-size="9.5" text-anchor="start">serves &#963;_B only; denies</text>
<text x="210" y="160" fill="#0b6b4f" font-size="9.5" text-anchor="start">&#963;_A (run), agent.md (integ.)</text>

<!-- ===================== (b) THE DEFENSE (merge DAG + gate) ===================== -->
<text x="10" y="188" class="b" fill="#03406a" font-size="12" text-anchor="start">(b) Two-stage gate on a true merge</text>

<!-- merge DAG -->
<rect x="168" y="196" width="48" height="22" rx="11" fill="#eef3f8" stroke="#03406a" stroke-width="1.3"/>
<text x="192" y="211" class="b" fill="#03406a" font-size="9.5" text-anchor="middle">m0</text>
<rect x="34" y="232" width="130" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
<text x="99" y="249" fill="#334155" font-size="9.5" text-anchor="middle">branch A: r_A (7d)</text>
<rect x="220" y="232" width="130" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
<text x="285" y="249" fill="#334155" font-size="9.5" text-anchor="middle">branch B: r_B (30d)</text>
<rect x="148" y="276" width="88" height="26" rx="6" fill="#eafaf3" stroke="#009e73" stroke-width="1.5"/>
<text x="192" y="293" class="b" fill="#0b6b4f" font-size="10" text-anchor="middle">merge m</text>
<line x1="178" y1="218" x2="104" y2="232" stroke="#5b6573" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="206" y1="218" x2="280" y2="232" stroke="#5b6573" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="100" y1="258" x2="164" y2="276" stroke="#5b6573" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="284" y1="258" x2="220" y2="276" stroke="#5b6573" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="344" y="272" fill="#6b7280" font-size="8.5" text-anchor="end">both are genuine</text>
<text x="344" y="283" fill="#6b7280" font-size="8.5" text-anchor="end">ancestors of m</text>

<line x1="192" y1="302" x2="192" y2="313" stroke="#5b6573" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="192" y="326" fill="#1f2937" font-size="9.5" text-anchor="middle">candidate set { r_A , r_B }</text>

<!-- Stage 1 -->
<rect x="8" y="332" width="368" height="50" rx="9" fill="#eef7f9" stroke="#0b7285" stroke-width="1.5"/>
<text x="20" y="351" class="b" fill="#075766" font-size="10.5" text-anchor="start">STAGE 1 &#183; PER-RECORD GATE</text>
<text x="218" y="351" fill="#6b7280" font-size="8.5" text-anchor="start">8 predicates; P7 reach., P8 integ.</text>
<text x="20" y="373" class="b" fill="#0b6b4f" font-size="10.5" text-anchor="start">r_A &#8594; ADMIT      r_B &#8594; ADMIT   (both reachable)</text>

<line x1="192" y1="382" x2="192" y2="392" stroke="#5b6573" stroke-width="1.4" marker-end="url(#ah)"/>

<!-- Stage 2 -->
<rect x="8" y="394" width="368" height="60" rx="9" fill="#eef3f8" stroke="#03406a" stroke-width="1.5"/>
<text x="20" y="413" class="b" fill="#03406a" font-size="10.5" text-anchor="start">STAGE 2 &#183; SET-LEVEL COHERENT VIEW</text>
<text x="20" y="431" class="b" fill="#a23a17" font-size="10" text-anchor="start">no cert &#8594; REQUIRE_RESOLUTION (union denied)</text>
<text x="20" y="448" class="b" fill="#0b6b4f" font-size="10" text-anchor="start">signed cert &#8594; serve adopted version only</text>

<text x="192" y="476" class="b" fill="#1f2937" font-size="10.5" text-anchor="middle">Reachable &#8800; adopted; valid-at-read &#8800; valid-at-commit.</text>
</svg>
