<svg xmlns="http://www.w3.org/2000/svg" width="384" height="364" viewBox="0 0 384 364" role="img" aria-labelledby="t d">
<title id="t">Complete-mediation coverage: only MBM-Core clears every attack family</title>
<desc id="d">An attack-family by defense matrix. Each cell shows whether a defense fully mediates a family (admits zero invalid records across all 20 cases) or is bypassed. Every single-paradigm baseline is bypassed by at least one family; the MBM-Core column is the only one that clears all nine families, mediating all 180 cases.</desc>
