<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="t d">
<title id="t">Core performance results: accuracy and full-FFCR, per-evaluation effect sizes, and negative controls</title>
<desc id="d">Three panels. (a) Memory-selection accuracy rises from 90.4 percent to 100 percent and the full failure-free-and-reconstructable rate rises from 0 to 100 percent. (b) Per-evaluation effect sizes with 95 percent confidence intervals: E1 0.122, E2 0.133, E3 0.130, aggregate E6 0.096 all exclude zero; E5 ties at zero because the oracle baseline is already perfect. (c) Binding-corrupting negative controls collapse toward chance (37 to 59 percent) while real MBM-Core reaches 100 percent.</desc>
<rect x="0" y="0" width="720" height="250" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;dominant-baseline:middle}</style>

<!-- ============ Panel (a): accuracy & full-FFCR ============ -->
<text x="128" y="16" fill="#1f2937" font-size="11.5" font-weight="800" text-anchor="middle">(a) selection acc. &amp; full-FFCR (%)</text>
<line x1="44" y1="40" x2="44" y2="205" stroke="#94a3b8" stroke-width="1.1"/>
<line x1="44" y1="205" x2="236" y2="205" stroke="#94a3b8" stroke-width="1.1"/>
<g fill="#5f6b7a" font-size="9" text-anchor="end">
<line x1="42" y1="205" x2="236" y2="205" stroke="#eef2f7"/><text x="40" y="205">0</text>
<line x1="42" y1="130" x2="236" y2="130" stroke="#eef2f7"/><text x="40" y="130">50</text>
<line x1="42" y1="55" x2="236" y2="55" stroke="#eef2f7"/><text x="40" y="55">100</text>
</g>
<rect x="64" y="69" width="22" height="136" fill="#94a3b8"/><text x="75" y="62" fill="#5f6b7a" font-size="9" text-anchor="middle">90.4</text>
<rect x="90" y="55" width="22" height="150" fill="#0b7285"/><text x="101" y="48" fill="#0b7285" font-size="9" font-weight="700" text-anchor="middle">100</text>
<rect x="146" y="203" width="22" height="2" fill="#94a3b8"/><text x="157" y="196" fill="#b23a48" font-size="9" text-anchor="middle">0</text>
<rect x="172" y="55" width="22" height="150" fill="#0b7285"/><text x="183" y="48" fill="#0b7285" font-size="9" font-weight="700" text-anchor="middle">100</text>
<text x="94" y="219" fill="#1f2937" font-size="9.5" font-weight="700" text-anchor="middle">MSA</text>
<text x="172" y="219" fill="#1f2937" font-size="9.5" font-weight="700" text-anchor="middle">full-FFCR</text>
<rect x="64" y="232" width="11" height="9" fill="#94a3b8"/><text x="79" y="237" fill="#5f6b7a" font-size="9" text-anchor="start">baseline</text>
<rect x="150" y="232" width="11" height="9" fill="#0b7285"/><text x="165" y="237" fill="#5f6b7a" font-size="9" text-anchor="start">MBM-Core</text>

<!-- ============ Panel (b): per-evaluation effect size + CI ============ -->
<text x="378" y="16" fill="#1f2937" font-size="11.5" font-weight="800" text-anchor="middle">(b) per-eval effect &#916; (95% CI)</text>
<line x1="300" y1="40" x2="300" y2="196" stroke="#475569" stroke-width="1.1" stroke-dasharray="3 3"/>
<line x1="300" y1="196" x2="470" y2="196" stroke="#94a3b8" stroke-width="1.1"/>
<g fill="#5f6b7a" font-size="9" text-anchor="middle">
<text x="300" y="208">0</text><text x="378" y="208">.10</text><text x="456" y="208">.20</text>
</g>
<!-- rows: E1 .122[.09,.16] E2 .133[.09,.17] E3 .130[.09,.18] E6 .096[.08,.12] E5 0 -->
<g font-size="9" fill="#1f2937" text-anchor="end" font-weight="700">
<text x="296" y="64">E1</text><text x="296" y="92">E2</text><text x="296" y="120">E3</text><text x="296" y="148">E6*</text><text x="296" y="176">E5</text></g>
<!-- E1 -->
<line x1="370" y1="64" x2="425" y2="64" stroke="#0b7285" stroke-width="1.6"/><circle cx="395" cy="64" r="3.5" fill="#0b7285"/><text x="431" y="64" fill="#0b7285" font-size="9" text-anchor="start">.122</text>
<!-- E2 -->
<line x1="370" y1="92" x2="433" y2="92" stroke="#0b7285" stroke-width="1.6"/><circle cx="404" cy="92" r="3.5" fill="#0b7285"/><text x="439" y="92" fill="#0b7285" font-size="9" text-anchor="start">.133</text>
<!-- E3 -->
<line x1="370" y1="120" x2="440" y2="120" stroke="#0b7285" stroke-width="1.6"/><circle cx="401" cy="120" r="3.5" fill="#0b7285"/><text x="446" y="120" fill="#0b7285" font-size="9" text-anchor="start">.130</text>
<!-- E6 aggregate -->
<line x1="362" y1="148" x2="394" y2="148" stroke="#5b21b6" stroke-width="1.8"/><circle cx="375" cy="148" r="3.8" fill="#5b21b6"/><text x="400" y="148" fill="#5b21b6" font-size="9" font-weight="700" text-anchor="start">.096</text>
<!-- E5 tie -->
<circle cx="300" cy="176" r="3.5" fill="#94a3b8"/><text x="308" y="176" fill="#5f6b7a" font-size="9" text-anchor="start">0 (tie: oracle already perfect)</text>
<text x="385" y="232" fill="#5f6b7a" font-size="8.5" text-anchor="middle">*E6 = aggregate; CIs exclude 0 for E1-E3,E6</text>

<!-- ============ Panel (c): negative controls vs real ============ -->
<text x="612" y="16" fill="#1f2937" font-size="11.5" font-weight="800" text-anchor="middle">(c) controls vs real (%)</text>
<line x1="520" y1="40" x2="520" y2="205" stroke="#94a3b8" stroke-width="1.1"/>
<line x1="520" y1="205" x2="712" y2="205" stroke="#94a3b8" stroke-width="1.1"/>
<g fill="#5f6b7a" font-size="9" text-anchor="end">
<line x1="518" y1="205" x2="712" y2="205" stroke="#eef2f7"/><text x="516" y="205">0</text>
<line x1="518" y1="130" x2="712" y2="130" stroke="#eef2f7"/><text x="516" y="130">50</text>
<line x1="518" y1="55" x2="712" y2="55" stroke="#eef2f7"/><text x="516" y="55">100</text>
</g>
<line x1="520" y1="130" x2="712" y2="130" stroke="#b23a48" stroke-width="0.9" stroke-dasharray="4 3"/><text x="710" y="123" fill="#b23a48" font-size="8" text-anchor="end">chance</text>
<rect x="536" y="147" width="20" height="58" fill="#b23a48"/><text x="546" y="140" fill="#b23a48" font-size="8.5" text-anchor="middle">38.8</text>
<rect x="564" y="149" width="20" height="56" fill="#b23a48"/><text x="574" y="142" fill="#b23a48" font-size="8.5" text-anchor="middle">37.5</text>
<rect x="592" y="130" width="20" height="75" fill="#b23a48"/><text x="602" y="123" fill="#b23a48" font-size="8.5" text-anchor="middle">50.0</text>
<rect x="620" y="117" width="20" height="88" fill="#b23a48"/><text x="630" y="110" fill="#b23a48" font-size="8.5" text-anchor="middle">58.8</text>
<rect x="660" y="55" width="22" height="150" fill="#2f855a"/><text x="671" y="48" fill="#2f855a" font-size="9" font-weight="700" text-anchor="middle">100</text>
<g font-size="8.5" fill="#1f2937" text-anchor="middle">
<text x="546" y="218">label</text><text x="574" y="218">shuf</text><text x="602" y="218">wrong</text><text x="630" y="218">rand</text><text x="671" y="218" fill="#2f855a" font-weight="700">real</text></g>
<text x="616" y="237" fill="#5f6b7a" font-size="8.5" text-anchor="middle">binding-corrupting controls collapse; real MBM-Core = 100%</text>
</svg>
