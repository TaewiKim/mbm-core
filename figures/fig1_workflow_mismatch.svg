<svg xmlns="http://www.w3.org/2000/svg" width="350" height="298" viewBox="0 0 350 298" role="img" aria-labelledby="t d">
<title id="t">The communication-memory mismatch: context-axis and integrity-axis</title>
<desc id="d">Two motivating attack scenarios on a shared store, each read two ways. Scenario 1 (context axis): the store holds sigma_A from run A while the active message m is run B; an unbound read (C4) serves sigma_A and is confidently wrong, while a message-bound read (C5) denies it on a run mismatch and serves only sigma_B. Scenario 2 (integrity axis, prompt injection): the store holds a downloaded agent.md with untrusted content; an unbound read executes it and is prompt-injected, while a message-bound read denies it by integrity flow (Biba). Relevance and a real-but-untrusted source are not authorization.</desc>
<defs><style>text{font-family:DejaVuSans}.b{font-family:DejaVuSans-Bold}</style></defs>
<rect x="0" y="0" width="350" height="298" fill="#ffffff"/>

<!-- title -->
<rect x="6" y="6" width="338" height="30" rx="8" fill="#0b7285"/>
<text x="175" y="26" class="b" fill="#ffffff" font-size="13.5" text-anchor="middle">COMMUNICATION&#8211;MEMORY MISMATCH</text>
<text x="175" y="49" fill="#5b6573" font-size="9.5" text-anchor="middle">relevance and a real-but-untrusted source are not authorization</text>

<!-- Scenario 1 -->
<text x="10" y="68" class="b" fill="#0b7285" font-size="12.5" text-anchor="start">1 &#183; Context mismatch (cross-run)</text>
<rect x="8" y="74" width="334" height="40" rx="7" fill="#fbeadd" stroke="#d55e00" stroke-width="1.4"/>
<text x="16" y="91" class="b" fill="#a23a17" font-size="11.5" text-anchor="start">C4 unbound &#8594; serves &#963;_A &#8594; WRONG</text>
<text x="16" y="107" fill="#7a2e1a" font-size="10" text-anchor="start">acts on a cross-run record (run A &#8800; B)</text>
<rect x="8" y="118" width="334" height="40" rx="7" fill="#e1f3ec" stroke="#009e73" stroke-width="1.4"/>
<text x="16" y="135" class="b" fill="#0b6b4f" font-size="11.5" text-anchor="start">C5 bound &#8594; denies &#963;_A (run_id_mismatch)</text>
<text x="16" y="151" fill="#0b6b4f" font-size="10" text-anchor="start">&#8594; serves only &#963;_B (run B)</text>

<!-- Scenario 2 -->
<text x="10" y="180" class="b" fill="#7c3aed" font-size="12.5" text-anchor="start">2 &#183; Prompt injection (agent.md)</text>
<rect x="8" y="186" width="334" height="40" rx="7" fill="#fbeadd" stroke="#d55e00" stroke-width="1.4"/>
<text x="16" y="203" class="b" fill="#a23a17" font-size="11.5" text-anchor="start">C4 unbound &#8594; executes it &#8594; INJECTED</text>
<text x="16" y="219" fill="#7a2e1a" font-size="10" text-anchor="start">indirect injection via an auto-read file</text>
<rect x="8" y="230" width="334" height="40" rx="7" fill="#e1f3ec" stroke="#009e73" stroke-width="1.4"/>
<text x="16" y="247" class="b" fill="#0b6b4f" font-size="11.5" text-anchor="start">C5 bound &#8594; denies it (integrity flow, Biba)</text>
<text x="16" y="263" fill="#0b6b4f" font-size="10" text-anchor="start">&#8594; untrusted-derived content not served</text>

<!-- footer -->
<text x="175" y="288" class="b" fill="#1f2937" font-size="10" text-anchor="middle">C5 binds the active message's context and integrity.</text>
</svg>
