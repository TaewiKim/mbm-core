<svg xmlns="http://www.w3.org/2000/svg" width="384" height="302" viewBox="0 0 384 302" role="img" aria-labelledby="t d">
<title id="t">Measured outcomes: the gate drives forbidden-memory selections to zero while task success rises</title>
<desc id="d">Two bar panels over three model families on the main split, comparing the ungated control C4 with the message-bound monitor C5. Top: forbidden-memory selections fall to zero under C5 for every model. Bottom: task success rises under C5 for every model. The gate removes cross-context contamination without sacrificing utility.</desc>
<defs><style>text{font-family:DejaVuSans}.b{font-family:DejaVuSans-Bold}</style></defs>
<rect x="0" y="0" width="384" height="302" fill="#ffffff"/>
<text x="192" y="18" class="b" fill="#1f2937" font-size="13" text-anchor="middle">Measured outcomes: C5 (MBM) vs C4 (ungated)</text>
<rect x="116" y="26" width="11" height="9" rx="2" fill="#d8775a" stroke="#b23a17"/><text x="130" y="34" fill="#475569" font-size="9" text-anchor="start">C4 ungated</text>
<rect x="208" y="26" width="11" height="9" rx="2" fill="#3bb38a" stroke="#0b6b4f"/><text x="222" y="34" fill="#475569" font-size="9" text-anchor="start">C5 MBM (main split)</text>
<text x="8" y="54" class="b" fill="#a23a17" font-size="10.5" text-anchor="start">(a) Forbidden-memory selections &#8595; (lower is better)</text>
